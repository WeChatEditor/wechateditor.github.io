name: Sync source to organization

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-org-source
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'tanghaojie/JLabWeChatEditor' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push source to organization
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.ORG_SOURCE_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$SYNC_TOKEN" ]; then
            echo "Missing ORG_SOURCE_SYNC_TOKEN"
            exit 1
          fi

          auth="$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push \
            https://github.com/WeChatEditor/wechateditor.github.io.git \
            HEAD:refs/heads/master
